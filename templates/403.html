{% extends 'base.html' %}
{% block title %}Доступ запрещён — 403{% endblock %}

{% block content %}
<div class="error-page">
  <div>
    <div class="error-number" aria-hidden="true">403</div>
    <div class="error-icon" aria-hidden="true"><i class="bi bi-shield-x"></i></div>
    <h2>Доступ запрещён</h2>
    <p>У вас недостаточно прав для просмотра этой страницы.</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
      <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
        <i class="bi bi-house" aria-hidden="true"></i> На главную
      </a>
      {% if not current_user.is_authenticated %}
      <a href="{{ url_for('login') }}" class="btn btn-outline btn-lg">
        <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Войти
      </a>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
